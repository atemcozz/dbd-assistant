# trapper quests

- id: trapper-message
  name: Послание дьявола
  description: |
    Найти все руны на карте, на каждой руне указана цифра, сложите их между собой и получите ответ
  type: EXPLORATION
  cost: 300
  killerCharacterTypeId: trapper

- id: trapper-puzzle
  name: Загадка
  description: |
    Решить загадку
  type: PUZZLE
  cost: 300
  killerCharacterTypeId: trapper

- id: trapper-probe
  name: Кажется, нащупал
  description: |
    Понять, что находится в коробке, полагаясь на осязание
  type: PUZZLE
  cost: 200
  killerCharacterTypeId: trapper

- id: trapper-pallete
  name: Палитра
  description: |
    Решить ребус из карточек
  type: PUZZLE
  cost: 100
  killerCharacterTypeId: trapper

- id: trapper-splinters
  name: Осколки прошлого
  description: |
    Найти и собрать фрагменты фотографии, прийти в указанное место и узнать ответ на свой вопрос
  type: EXPLORATION
  cost: 200
  killerCharacterTypeId: trapper

- id: trapper-cypher
  name: Шифр
  description: |
    Решить пример, сопоставив символы с цифрами
  type: PUZZLE
  cost: 200
  killerCharacterTypeId: trapper

- id: trapper-fidelity
  name: Верность
  description: |
    Расшифровать предложение
  type: PUZZLE
  cost: 100
  killerCharacterTypeId: trapper

- id: trapper-future
  name: А что будет потом? 
  description: |
    Определить последовательность и вставить правильное число
  type: PUZZLE
  cost: 100
  killerCharacterTypeId: trapper

- id: trapper-treasure
  name: Поиски клада 
  description: |
    Найти ключ в локации
  type: EXPLORATION
  cost: 100
  killerCharacterTypeId: trapper

- id: trapper-trick-treat
  name: "Квест Виктора: Сладость или гадость"
  description: |
    Решить загадку. Может выполнять только Виктор 
  type: EXPLORATION
  cost: 0
  killerCharacterTypeId: trapper

# nobody quests

- id: nobody-broken-pixel
  name: Битый пиксель
  description: |
    Найди и исправь неправильную ячейку в сообщении
  details: |
    Условие: https://forms.gle/Wc34zEDC5eKX3MC98
  type: PUZZLE
  cost: 90
  killerCharacterTypeId: nobody

- id: nobody-caesar
  name: Гай Юлий Цезарь
  description: |
    Закончи дешифрацию послания, оставленного другим бедолагой
  details: |
    Условие: https://forms.gle/2pPjLqULYj1X3SfP9
  type: PUZZLE
  cost: 100
  killerCharacterTypeId: nobody

- id: nobody-generator
  name: Электромонтажник
  description: |
    Определи общий ток эл. цепи по схеме
  details: |
    Условие: https://forms.gle/RWgSKJ5M8Zv4FGJY6
  type: PUZZLE
  cost: 115
  killerCharacterTypeId: nobody

- id: nobody-blind-spot
  name: Вне поля зрения
  description: |
    Определи на схеме путь от точки A до X с наименьшим числом камер
  details: |
    Условие: https://forms.gle/EZi9Ckoren5WmA76A
  type: PUZZLE
  cost: 125
  killerCharacterTypeId: nobody

- id: nobody-radio-amateur
  name: Радиолюбитель
  description: |
    Прослушай фрагмент аудиозаписи хакера и определи ключ доступа к серверу
  details: |
    Аудиозапись: https://example.com/tasks/nobody-radio-amateur
  type: PUZZLE
  cost: 160
  killerCharacterTypeId: nobody

- id: nobody-dutch-wheel
  name: Голландский киберштурвал
  description: |
    Найди комнату с рубильниками и удерживай их в комнате одновременно с другим игроком в течение 120 секунд, чтобы отключить центр связи хакера. Если ты остался один в живых, держи рубильник 180 секунд
  type: EXPLORATION
  cost: 155
  killerCharacterTypeId: nobody

- id: nobody-courier
  name: Курьер
  description: |
    Найти и доставить коробку с оборудованием на чердак. Пока коробка в руках, можно передвигаться только шагом, кидать коробку нельзя
  type: EXPLORATION
  cost: 145
  killerCharacterTypeId: nobody

- id: nobody-bruteforce
  name: Брутфорс
  description: |
    Перегрузи датчики маньяка, заполнив пакетный буфер недостающими числовыми значениями
  details: |
    Условие: https://forms.gle/V2T5Z38rmFGMaGs2A
  type: PUZZLE
  cost: 160
  killerCharacterTypeId: nobody

- id: nobody-detective
  name: Детектив
  description: |
    По раскиданным запискам определи местоположение первых жертв маньяка на момент взлома
  details: |
    Условие: https://forms.gle/ACKUGDs1pG6u7LTX7
  type: EXPLORATION
  cost: 160
  killerCharacterTypeId: nobody

- id: nobody-hotfix
  name: Хотфикс
  description: |
    Собери ссылку по отрывкам, разбросанным по локации, и отправь числовой запрос в базу данных
  type: EXPLORATION
  cost: 125
  killerCharacterTypeId: nobody

- id: nobody-anonymous
  name: Анонимус
  description: |
    Ожидай 180 секунд в указанном месте, прикрыв половину лица руками или одеждой от камеры
  details: |
    Локация: актовый зал на 3 этаже
  type: EXPLORATION
  cost: 115
  killerCharacterTypeId: nobody

- id: nobody-cinephile
  name: Киноман
  description: |
    Найди 3 диска на локации и принеси их в комнату с проектором (на чердаке)
  type: EXPLORATION
  cost: 185
  killerCharacterTypeId: nobody

- id: nobody-victor-vulnerability
  name: "Квест Виктора: Уязвимость"
  description: |
    Воспользуйся уязвимостью в системе клеток: найди и отнеси ключ-карту в указанное место
    Может выполнять только Виктор
  details: |
    Локация: комната у лестницы на 1 этаже (не сейф зона)
  type: EXPLORATION
  cost: 0
  killerCharacterTypeId: nobody

# king quests

- id: king-lucky-card
  name: Счастливая карта
  description: |
    Найди спрятанную карту Пик и принеси её Королю.
  type: EXPLORATION
  cost: 160
  killerCharacterTypeId: king

- id: king-royal-secret
  name: Королевская тайна
  description: |
    Найди записку на локации и прочитай Королю написанное на ней послание.
  type: EXPLORATION
  cost: 160
  killerCharacterTypeId: king

- id: king-little-prank
  name: Маленькая пакость
  description: |
    Незаметно переставь два предмета, оставленных организатором, на другие места.
  type: EXPLORATION
  cost: 160
  killerCharacterTypeId: king

- id: king-curious-joker
  name: Любопытный Джокер
  description: |
    Найди спрятанный символ Джокера и покажи его Королю
  type: EXPLORATION
  cost: 160
  killerCharacterTypeId: king

- id: king-stolen-order
  name: Украденный приказ
  description: |
    Найди записку, спрятанную на карте, и отнеси её другому Выжившему, выдав за приказ Короля.
  type: EXPLORATION
  cost: 160
  killerCharacterTypeId: king

- id: king-deck-swap
  name: Подмена колоды
  description: |
    Найди две карточки с разными мастями и поменяй их местами.
  type: EXPLORATION
  cost: 160
  killerCharacterTypeId: king

- id: king-betrayal
  name: Предательская помощь
  description: |
    Начни помогать союзнику, но отвлеки его жестами и уведи от текущего занятия.
  type: EXPLORATION
  cost: 160
  killerCharacterTypeId: king

- id: king-secret-bet
  name: Секретная ставка
  description: |
    Найди три спрятанные цифры, сложи их и назови Королю полученный код
  type: PUZZLE
  cost: 160
  killerCharacterTypeId: king

- id: king-four-suits-curse
  name: Проклятие четырёх мастей
  description: |
    Найди на карте четыре карточки разных мастей и расположи их в правильном порядке, указанном в загадке Короля
  type: PUZZLE
  cost: 160
  killerCharacterTypeId: king

- id: king-last-pawn
  name: Последняя пешка
  description: |
    Найди спрятанную записку, выполни указанную в ней пакость над союзником, отыщи ключ и вернись с ним к Королю.
  type: EXPLORATION
  cost: 160
  killerCharacterTypeId: king

