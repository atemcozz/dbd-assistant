- id: kings-seal
  name: Печать Короля
  description: Квест заблокирован на 5 минут. Выжившие не могут взаимодействовать с ним или завершить его.
  action: INFO
  defaultDuration: 300

- id: corruption
  name: Порча
  description: Запрещено бегать, лечиться и взаимодействовать с предметами. Найди антидот в течение 5 минут или получи нокаут.
  action: INFO
  defaultDuration: 300

- id: slowdown
  name: Тише едешь — дальше будешь
  description: Запрещено переходить на бег в течение 5 минут (разрешён только шаг).
  action: INFO
  defaultDuration: 300

- id: sluggishness
  name: Оцепенение
  description: Ты не можешь совершать никаких игровых действий, кроме перемещения.
  action: INFO
  defaultDuration: 300

- id: indifference
  name: Равнодушие
  description: Запрещено спасать союзников из клетки до момента открытия основных ворот.
  action: INFO
  defaultDuration: null

- id: heal-potion
  name: Зелье здоровья
  description: Восстанавливает 1 единицу здоровья (HP).
  action: HEAL
  params:
    quantity: 1
  defaultDuration: null

- id: hallucination
  name: Галлюцинация
  description: В течение 20 секунд ты обязан каждые несколько секунд громко кричать «Я здесь!».
  action: INFO
  defaultDuration: 20

- id: antidote
  name: Антидот
  description: Снимает все действующие негативные эффекты и дебаффы.
  action: INFO
  defaultDuration: null

- id: medkit
  name: Аптечка
  description: Применение восстанавливает 1 HP за 30 секунд перевязки.
  action: HEAL
  params:
    quantity: 1
  defaultDuration: 30

- id: adrenaline
  name: Адреналин
  description: Ты неуязвим. Любые атаки маньяка не действуют в течение 3 минут.
  action: INFO
  defaultDuration: 120

- id: castle
  name: Крепость
  description: Все входы и двери в текущее помещение заблокированы на 5 минут.
  action: INFO
  defaultDuration: 300


- id: shock-therapy
  name: Паралич током
  description: Ты поражён электрошоком. Запрещено двигаться и совершать любые действия в течение 2 минут.
  action: INFO
  defaultDuration: 120

- id: marionette-curse
  name: Подчинение Маски
  description: Ты стал марионеткой на 3 минуты. Запрещено покидать комнату. Ты обязан напасть на любого вошедшего выжившего.
  action: INFO
  defaultDuration: 180

- id: stun-killer
  name: Ослепление маньяка
  description: Маньяк ослеплён фонариком и обязан оставаться на месте 15 секунд.
  action: INFO
  defaultDuration: 15

- id: field-dressing
  name: Квалифицированная помощь
  description: Оказана медицинская помощь. Восстановлено 1 HP.
  action: HEAL
  params:
    quantity: 1
  defaultDuration: null

- id: self-attack
  name: Получение урона
  description: Получен урон. Снято 1 HP.
  action: HURT
  params:
    quantity: 1
  defaultDuration: null


- id: scumbags-siren
  name: "Тревога: Отбросы общества"
  description: >
    Звучит сирена!
    Срочно беги к контрольной кнопке и нажми её.
    Игрок, нажавший последним, отправляется в клетку.
  action: INFO
  defaultDuration: 60

- id: kings-waltz-call
  name: "Приказ: Вальс Короля"
  description: >
    Играет вальс!
    Все выжившие обязаны немедленно собраться в зале со стульями.
    Не успевший занять стул игрок понесёт суровое наказание.
  action: INFO
  defaultDuration: 90


- id: meditation-trance
  name: Боевая медитация
  description: >
    Маньяк находится в медитации (3 минуты).
    После окончания музыки в течение 2 минут твои его мгновенно нокаутируют с 1 попадания и позволяют казнить жертву.
  action: INFO
  defaultDuration: 300

- id: rage-call
  name: "Приказ: Ярость Ронина"
  description: >
    Звучит боевая музыка Ронина!
    Ты обязан громко кричать «Я здесь!» каждые 10 секунд, пока играет музыка.
    Маньяк нокаутирует с 1 удара.
  action: INFO
  defaultDuration: 210

- id: sabotage-escape
  name: Замок сломан
  description: >
    Клетка взломана с помощью саботажа.
    Ты (или спасённый союзник) можешь немедленно покинуть клетку.
  action: INFO
  defaultDuration: null

- id: dejavu-request
  name: "Дежавю: Требование подсказки"
  description: >
    Выживший применил к тебе способность «Дежавю».
    Ты обязан дать ему одну правдивую подсказку по текущему квесту или окружению.
  action: INFO
  defaultDuration: 60


- id: healme
  name: Хилка
  description: Оказана медицинская помощь. Восстановлено 1 HP.
  action: HEAL
  params:
    quantity: 1
  defaultDuration: null