- id: main-gate
  name: Главные ворота
  description: Выход открыт после выполнения необходимого количества квестов.
    После открытия нужно подойти к воротам и оставаться рядом с ними 60 секунд.
- id: side-door
  name: Боковая дверь
  description: Чтобы открыть выход, нужен найденный ключ с биркой. После открытия
    можно покинуть здание.
- id: broken-window
  name: Разбитое окно
  description: Выход находится на первом этаже. После открытия ворот выжившие
    должны подойти к окну и дождаться команды выйти.
