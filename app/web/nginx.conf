# Static SPA hosting — no server-side logic, keep nginx minimal.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted build assets — safe to cache forever.
    # Asset URLs are relative (Vite base './'), so the browser requests
    # them under the page path and the reverse proxy strips its prefix
    # before they arrive here. Files resolve at the dist root.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
